# Better terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Faster key response
set -sg escape-time 10

# Larger scrollback
set -g history-limit 50000

# Easier splits. Keep the editor/main pane larger than the supporting pane.
# The percentages apply to the new pane, so a horizontal split gives the
# supporting pane 30% of the width and a vertical split gives it 30% height.
bind | split-window -h -p 30 -c "#{pane_current_path}"
bind - split-window -v -p 30 -c "#{pane_current_path}"

# Apply a predictable layout to the current window's existing panes.
bind = select-layout main-horizontal

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# TMUX plugins
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'

# Tmux persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically save tmux sessions
set -g @continuum-save-interval '15'

# Restore manually with tmux-resurrect (prefix + Ctrl-r). Automatic restore
# can recreate the old `ide` layout before tmux-ide has a chance to build its
# predefined layout.
set -g @continuum-restore 'off'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
