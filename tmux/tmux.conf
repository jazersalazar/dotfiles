# Better terminal colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Faster key response
set -sg escape-time 10

# Larger scrollback
set -g history-limit 50000

# Redraw the status bar once a second. This covers the clock on its own, and
# is the fallback if the ticker loop below is not running.
set -g status-interval 1

# The quote types itself out a character at a time, and tmux re-runs a `#()`
# status job only once per second no matter what status-interval says, so the
# extra redraws have to be driven from here. Keep this sleep the largest common
# divisor of the timing constants in quote.sh (50ms); otherwise a character is
# held for an uneven number of redraws and the typing looks jittery. The
# generation check is batched one to a second rather than run every tick, so
# twenty redraws a second cost twenty processes instead of forty.
#
# A newer loop registers its PID and the older one retires itself when it sees
# the change. Do not go back to having the new loop kill the old one: tmux
# reports any run-shell job that dies by signal as "terminated by signal 15",
# so every config reload printed an error. show-option is -gqv so the first run
# on a fresh server does not error on the not-yet-set option, and
# refresh-client's stderr is dropped for the moments when no client is attached.
run-shell -b 'gen=$$; tmux set-option -g @quote-ticker-pid $gen; while [ "$(tmux show-option -gqv @quote-ticker-pid)" = "$gen" ]; do n=0; while [ $n -lt 20 ]; do tmux refresh-client -S 2>/dev/null; sleep 0.05; n=$((n + 1)); done; done'

# Easier splits. Keep the editor/main pane larger than the supporting pane.
# The percentages apply to the new pane, so a horizontal split gives the
# supporting pane 30% of the width and a vertical split gives it 30% height.
bind | split-window -h -p 30 -c "#{pane_current_path}"
bind - split-window -v -p 30 -c "#{pane_current_path}"

# Apply a predictable layout to the current window's existing panes.
bind = select-layout main-horizontal

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# TMUX plugins
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins 'time custom:../../../quote.sh'
# The left icon replaces dracula's default smiley, but its colors are set by
# the status-left override at the bottom of this file rather than here: dracula
# paints the space around ${left_icon} with its own green, so styling only the
# icon string leaves a stray green column beside it.
# Dracula owns status-interval once it loads, so keep it in step with the above.
set -g @dracula-refresh-rate 1
set -g @dracula-military-time false
set -g @dracula-time-format '%b %-d, %a %-I:%M %p'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tpm'

# Tmux persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically save tmux sessions
set -g @continuum-save-interval '15'

# Restore manually with tmux-resurrect (prefix + Ctrl-r). Automatic restore
# can recreate the old `ide` layout before tmux-ide has a chance to build its
# predefined layout.
set -g @continuum-restore 'off'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'

# Plugins may define an additional status format. Reassert one status line
# after they load so opening or switching sessions cannot stack status bars.
set -g status on
set -gu status-format[1]

# Own the left block outright instead of going through @dracula-show-left-icon,
# so the icon's foreground, background and padding are all one style. Dracula's
# yellow prefix-pressed highlight is kept.
set -g status-left '#[bg=#bd93f9,fg=#f8f8f2,bold]#{?client_prefix,#[bg=#f1fa8c]#[fg=#282a36],} </> #[default]'

# tmux-continuum hooks its save script into status-right, so it runs on every
# single redraw -- about twenty forks a time, and the quote ticker asks for
# twenty redraws a second. The script decides for itself whether the save
# interval has elapsed, so take it off the redraw path and call it once a minute
# instead: same 15-minute saves, ~430 fewer forks a second.
# Two things to know about this line. It is not backgrounded, so that it lands
# after continuum's own read-modify-write of status-right rather than racing it.
# And the sed pattern writes the literal "#(" as "##(", because tmux expands
# formats in a run-shell command string too: an unescaped #( is taken as a
# #(shell-command) format and swallowed before sed ever sees it.
run-shell 'r=$(tmux show-option -gv status-right); tmux set-option -g status-right "$(printf %s "$r" | sed -e "s|##([^)]*continuum_save\.sh)||")"'
# One tmux call a second keeps the retirement check responsive; the save script
# itself, which is the expensive part, runs once a minute.
run-shell -b 'gen=$$; tmux set-option -g @continuum-tick-pid $gen; n=0; while [ "$(tmux show-option -gqv @continuum-tick-pid)" = "$gen" ]; do n=$((n + 1)); [ $n -ge 60 ] && { n=0; "$HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh"; }; sleep 1; done'
